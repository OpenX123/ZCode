    />
    <title>YCode</title>
    <script>
      (() => {
        // Bugfix: Web 远控跨 workspace 跳转时，JS bundle 还没执行前就会先渲染启动壳。
        // 这里提前按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "zcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };
        const BOOTSTRAP_SNAPSHOT_KEY = "zcode:web-remote-control:bootstrap-shell";

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-zcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          let bootstrapTheme = null;
          const bootstrapSnapshotRaw = window.sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY);
          if (bootstrapSnapshotRaw) {
            window.sessionStorage.removeItem(BOOTSTRAP_SNAPSHOT_KEY);
            try {
              const snapshot = JSON.parse(bootstrapSnapshotRaw);
              if (snapshot && typeof snapshot === "object") {
                const normalizedTheme = snapshot.theme === "dark" ? "dark" : "light";
                bootstrapTheme = normalizedTheme;
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-bg",
                  typeof snapshot.background === "string"
                    ? snapshot.background
                    : normalizedTheme === "dark"
                      ? "#0f172a"
                      : "#f8fafc",
                );
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-fg",
                  typeof snapshot.foreground === "string"
                    ? snapshot.foreground
                    : normalizedTheme === "dark"
                      ? "#e2e8f0"
                      : "#334155",
                );
                if (typeof snapshot.border === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-border",
                    snapshot.border,
                  );
                }
                if (typeof snapshot.card === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-card",
                    snapshot.card,
                  );
                }
              }
            } catch {
              // ignore invalid snapshot
            }
          }

          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const fallbackTheme = resolved === "dark" ? "dark" : "light";
          const finalTheme = bootstrapTheme ?? fallbackTheme;
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-bootstrap-theme="light"] body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-zcode-browser-theme-surface],
      html[data-zcode-browser-theme-surface] body,
      html[data-zcode-browser-theme-surface] #root {
        /* 修复原因：共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--zcode-bootstrap-bg, #161616)) !important;
      }

      html[data-zcode-browser-theme-surface="light"],
      html[data-zcode-browser-theme-surface="light"] body,
      html[data-zcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--zcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .zcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Bugfix: UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。 */
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .zcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
      }

      .zcode-boot-loading__logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading__logo {
        filter: brightness(0);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Bugfix: 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。 -->
      <div
        class="zcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="zcode-boot-loading__logo-shell">
          <img src="/ycode-logo.png" class="zcode-boot-loading__logo" alt="" aria-hidden="true" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
