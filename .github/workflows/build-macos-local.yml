name: Build Mac ARM64 locally without publishing

# 在正式标签 ref 上手动运行：gh workflow run build-macos-local.yml --ref v<version>
# 版本取自该标签处的 package.json；本 job 同时生成本轮唯一的 Source Server 资源与 descriptor，
# 不依赖其他 run 的会过期 artifact。Windows 本机构建通过 source_run_id 复用这里的 descriptor。
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build local Source Server resources and Mac ARM64 installers
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v1.') }}
    runs-on: [self-hosted, macOS, ARM64, zcode-macos]
    timeout-minutes: 180
    env:
      ZCODE_ENV: production
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Resolve release identity from package.json and tag
        run: node scripts/github-release-version.mjs local-identity

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate all four remote targets once
        run: pnpm prepare:remote-assets

      - name: Verify archives and pin release URLs
        run: node scripts/github-release-assets.mjs pin --output release-resources

      - name: Upload remote release resources
        uses: actions/upload-artifact@v7
        with:
          name: source-server-resources-${{ env.RELEASE_TAG }}
          path: release-resources/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload shared desktop descriptor
        uses: actions/upload-artifact@v7
        with:
          name: source-server-descriptor-${{ env.RELEASE_TAG }}
          path: release-resources/source-server-release.json
          if-no-files-found: error
          retention-days: 14

      - name: Keep only the pinned descriptor for the lightweight build
        run: |
          set -euo pipefail
          rm -rf "packages/desktop/mock-cdn/releases/$RELEASE_VERSION"
          mkdir -p "packages/desktop/mock-cdn/releases/$RELEASE_VERSION"
          cp release-resources/source-server-release.json "packages/desktop/mock-cdn/releases/$RELEASE_VERSION/"

      - name: Build installer
        run: pnpm bundle:desktop -- --os mac --arch arm64
        env:
          ZCODE_REMOTE_ASSET_DESCRIPTOR_ONLY: "1"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ycode-mac-arm64-${{ env.RELEASE_TAG }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload package size audit
        uses: actions/upload-artifact@v7
        with:
          name: package-size-report-mac-arm64-${{ env.RELEASE_TAG }}
          path: packages/desktop/dist/*.size-report.json
          if-no-files-found: error
          retention-days: 14
