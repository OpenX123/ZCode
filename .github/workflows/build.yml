name: Build and release YCode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            arch: arm64
            runner: macos-14
          - os: mac
            arch: x64
            runner: macos-15-intel
          - os: win
            arch: x64
            runner: windows-2025
          - os: win
            arch: arm64
            runner: windows-11-arm

    env:
      ZCODE_ENV: production
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build installer
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }}
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ycode-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ycode-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -- *.dmg *.zip *.exe > SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "YCode build $GITHUB_RUN_NUMBER" \
              --notes "由 GitHub Actions 从提交 $GITHUB_SHA 自动构建。包含 macOS / Windows 的 ARM64 与 x64 安装包。安装说明见仓库 README。" \
              --target "$GITHUB_SHA"
          fi
